<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقييم التكوين - قادة الكشافة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #1e3c2c 0%, #2a5a3a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .evaluation-card {
            background-color: #fefefe;
            max-width: 750px;
            width: 100%;
            border-radius: 40px 40px 30px 30px;
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.5), 0 0 0 2px #c9a45c inset;
            padding: 2.5rem 2rem 2rem;
            position: relative;
            border: 1px solid #b58b3e;
        }

        .scout-emblem {
            text-align: center;
            font-size: 3rem;
            color: #2a5a3a;
            margin-top: -1.8rem;
            margin-bottom: 0.5rem;
            filter: drop-shadow(0 6px 4px rgba(0,0,0,0.2));
        }

        .scout-emblem i {
            background: #f5e7c8;
            padding: 0.6rem 1.2rem;
            border-radius: 100px;
            box-shadow: 0 4px 0 #8b6b2c;
            border: 1px solid #b58b3e;
        }

        h1 {
            font-size: 2.2rem;
            color: #1e3c2c;
            text-align: center;
            margin-bottom: 0.25rem;
            font-weight: 700;
            text-shadow: 0 1px 2px #e0d6b0;
        }

        .subhead {
            text-align: center;
            color: #5a6b4a;
            font-size: 1.1rem;
            margin-bottom: 2rem;
            border-bottom: 2px dashed #c9a45c;
            padding-bottom: 0.75rem;
        }

        .form-group {
            margin-bottom: 1.4rem;
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            color: #1e3c2c;
            margin-bottom: 0.5rem;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        label i {
            color: #b58b3e;
            width: 1.4rem;
            text-align: center;
        }

        input, textarea {
            width: 100%;
            padding: 0.9rem 1.2rem;
            border: 2px solid #d4c5a2;
            border-radius: 18px;
            background-color: #fffdf7;
            font-size: 1rem;
            transition: all 0.2s;
            outline: none;
            color: #1e2a1e;
            font-weight: 500;
            resize: vertical;
        }

        input:focus, textarea:focus {
            border-color: #2a5a3a;
            box-shadow: 0 0 0 4px rgba(42, 90, 58, 0.15);
            background-color: #ffffff;
        }

        textarea {
            min-height: 90px;
        }

        .row-2 {
            display: flex;
            gap: 1.2rem;
        }

        .row-2 .form-group {
            flex: 1;
        }

        /* ---- Rating buttons (Des PUS) ---- */
        .rating-group {
            margin-bottom: 1.2rem;
        }

        .rating-label {
            font-weight: 600;
            color: #1e3c2c;
            margin-bottom: 0.5rem;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .rating-label i {
            color: #b58b3e;
            width: 1.4rem;
            text-align: center;
        }

        .rating-buttons {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .rating-buttons input[type="radio"] {
            display: none;
        }

        .rating-buttons label {
            flex: 1;
            min-width: 70px;
            text-align: center;
            padding: 0.6rem 0.3rem;
            border: 2px solid #d4c5a2;
            border-radius: 14px;
            background-color: #fffdf7;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            color: #5a6b4a;
            transition: all 0.2s;
            user-select: none;
        }

        .rating-buttons label:hover {
            border-color: #b58b3e;
            background-color: #fdf6e8;
        }

        .rating-buttons input[type="radio"]:checked + label {
            background-color: #2a5a3a;
            color: #fefefe;
            border-color: #c9a45c;
            box-shadow: 0 4px 0 #0d2b1a;
            transform: translateY(-2px);
        }

        .btn-submit {
            background: #2a5a3a;
            color: #fefefe;
            border: none;
            padding: 1.1rem 2rem;
            font-size: 1.3rem;
            font-weight: 700;
            border-radius: 60px;
            width: 100%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            box-shadow: 0 10px 0 #0d2b1a, 0 8px 18px rgba(0, 0, 0, 0.3);
            transition: all 0.1s ease;
            margin-top: 1rem;
            letter-spacing: 1px;
            border: 2px solid #c9a45c;
            margin-bottom: 0.5rem;
        }

        .btn-submit:hover {
            background: #1f462b;
            transform: translateY(-2px);
            box-shadow: 0 12px 0 #0d2b1a, 0 12px 22px rgba(0, 0, 0, 0.35);
        }

        .btn-submit:active {
            transform: translateY(4px);
            box-shadow: 0 6px 0 #0d2b1a, 0 8px 18px rgba(0, 0, 0, 0.3);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .note {
            text-align: center;
            font-size: 0.9rem;
            color: #6b6b5a;
            margin-top: 0.8rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            background: #f0eadb;
            padding: 8px 12px;
            border-radius: 40px;
        }

        .note i {
            color: #b58b3e;
        }

        @media (max-width: 600px) {
            .evaluation-card {
                padding: 2rem 1.2rem 1.5rem;
                border-radius: 30px 30px 20px 20px;
            }
            h1 { font-size: 1.8rem; }
            .row-2 { flex-direction: column; gap: 0; }
            .btn-submit { font-size: 1.1rem; padding: 0.9rem 1rem; }
            .scout-emblem { font-size: 2.5rem; }
            .rating-buttons label { min-width: 55px; font-size: 0.75rem; padding: 0.5rem 0.2rem; }
        }

        /* Success Popup */
        .success-popup {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }

        .success-popup.show {
            display: flex;
        }

        .popup-content {
            background: white;
            padding: 2.5rem 2rem;
            border-radius: 30px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            border: 3px solid #c9a45c;
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .popup-content i {
            font-size: 4rem;
            color: #2a5a3a;
            margin-bottom: 1rem;
        }

        .popup-content h2 {
            color: #1e3c2c;
            margin-bottom: 0.5rem;
        }

        .popup-content p {
            color: #555;
            margin-bottom: 1.5rem;
        }

        .popup-content button {
            background: #2a5a3a;
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 30px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 600;
        }

        .popup-content button:hover {
            background: #1f462b;
        }
    </style>
</head>
<body>
    <div class="evaluation-card">
        <div class="scout-emblem">
            <i class="fas fa-tree"></i>
        </div>

        <h1>تقييم التكوين</h1>
        <div class="subhead">
            <i class="fas fa-flag"></i> قادة الكشافة <i class="fas fa-flag"></i>
        </div>

        <form id="scoutEvalForm" action="https://formsubmit.co/houssemkessentini77@gmail.com" method="POST">
            
            <!-- FormSubmit Config -->
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_subject" value="تقييم تكوين جديد - قادة الكشافة">
            <input type="hidden" name="_template" value="table">
            <input type="hidden" name="_next" value="https://yourwebsite.com/thanks.html">

            <div class="row-2">
                <div class="form-group">
                    <label for="nom"><i class="fas fa-user"></i> الاسم</label>
                    <input type="text" id="nom" name="الاسم" placeholder="مثال: أحمد" required>
                </div>
                <div class="form-group">
                    <label for="prenom"><i class="fas fa-user-tag"></i> اللقب</label>
                    <input type="text" id="prenom" name="اللقب" placeholder="مثال: بن علي" required>
                </div>
            </div>

            <!-- ====== معايير التقييم ====== -->

            <!-- 1. استفادة المكوّن من التكوين -->
            <div class="rating-group">
                <div class="rating-label">
                    <i class="fas fa-user-graduate"></i> استفادة المكوّن من التكوين
                </div>
                <div class="rating-buttons">
                    <input type="radio" id="istifada1" name="استفادة_المكون_من_التكوين" value="ضعيف" required>
                    <label for="istifada1">ضعيف</label>
                    <input type="radio" id="istifada2" name="استفادة_المكون_من_التكوين" value="متوسط">
                    <label for="istifada2">متوسط</label>
                    <input type="radio" id="istifada3" name="استفادة_المكون_من_التكوين" value="جيد">
                    <label for="istifada3">جيد</label>
                    <input type="radio" id="istifada4" name="استفادة_المكون_من_التكوين" value="جيد جداً">
                    <label for="istifada4">جيد جداً</label>
                    <input type="radio" id="istifada5" name="استفادة_المكون_من_التكوين" value="ممتاز">
                    <label for="istifada5">ممتاز</label>
                </div>
            </div>

            <!-- 2. طرق تقديم التكوين -->
            <div class="rating-group">
                <div class="rating-label">
                    <i class="fas fa-chalkboard-teacher"></i> طرق تقديم التكوين
                </div>
                <div class="rating-buttons">
                    <input type="radio" id="torok1" name="طرق_تقديم_التكوين" value="ضعيف" required>
                    <label for="torok1">ضعيف</label>
                    <input type="radio" id="torok2" name="طرق_تقديم_التكوين" value="متوسط">
                    <label for="torok2">متوسط</label>
                    <input type="radio" id="torok3" name="طرق_تقديم_التكوين" value="جيد">
                    <label for="torok3">جيد</label>
                    <input type="radio" id="torok4" name="طرق_تقديم_التكوين" value="جيد جداً">
                    <label for="torok4">جيد جداً</label>
                    <input type="radio" id="torok5" name="طرق_تقديم_التكوين" value="ممتاز">
                    <label for="torok5">ممتاز</label>
                </div>
            </div>

            <!-- 3. قيمة المعلومات المقدمة في التكوين -->
            <div class="rating-group">
                <div class="rating-label">
                    <i class="fas fa-book-open"></i> قيمة المعلومات المقدمة في التكوين
                </div>
                <div class="rating-buttons">
                    <input type="radio" id="qimat1" name="قيمة_المعلومات_المقدمة" value="ضعيف" required>
                    <label for="qimat1">ضعيف</label>
                    <input type="radio" id="qimat2" name="قيمة_المعلومات_المقدمة" value="متوسط">
                    <label for="qimat2">متوسط</label>
                    <input type="radio" id="qimat3" name="قيمة_المعلومات_المقدمة" value="جيد">
                    <label for="qimat3">جيد</label>
                    <input type="radio" id="qimat4" name="قيمة_المعلومات_المقدمة" value="جيد جداً">
                    <label for="qimat4">جيد جداً</label>
                    <input type="radio" id="qimat5" name="قيمة_المعلومات_المقدمة" value="ممتاز">
                    <label for="qimat5">ممتاز</label>
                </div>
            </div>

            <!-- 4. كفاءة المكوّن -->
            <div class="rating-group">
                <div class="rating-label">
                    <i class="fas fa-user-tie"></i> كفاءة المكوّن
                </div>
                <div class="rating-buttons">
                    <input type="radio" id="kafaa1" name="كفاءة_المكون" value="ضعيف" required>
                    <label for="kafaa1">ضعيف</label>
                    <input type="radio" id="kafaa2" name="كفاءة_المكون" value="متوسط">
                    <label for="kafaa2">متوسط</label>
                    <input type="radio" id="kafaa3" name="كفاءة_المكون" value="جيد">
                    <label for="kafaa3">جيد</label>
                    <input type="radio" id="kafaa4" name="كفاءة_المكون" value="جيد جداً">
                    <label for="kafaa4">جيد جداً</label>
                    <input type="radio" id="kafaa5" name="كفاءة_المكون" value="ممتاز">
                    <label for="kafaa5">ممتاز</label>
                </div>
            </div>

            <!-- 5. التنظيم العام للتكوين -->
            <div class="rating-group">
                <div class="rating-label">
                    <i class="fas fa-calendar-check"></i> التنظيم العام للتكوين
                </div>
                <div class="rating-buttons">
                    <input type="radio" id="tanzim1" name="التنظيم_العام_للتكوين" value="ضعيف" required>
                    <label for="tanzim1">ضعيف</label>
                    <input type="radio" id="tanzim2" name="التنظيم_العام_للتكوين" value="متوسط">
                    <label for="tanzim2">متوسط</label>
                    <input type="radio" id="tanzim3" name="التنظيم_العام_للتكوين" value="جيد">
                    <label for="tanzim3">جيد</label>
                    <input type="radio" id="tanzim4" name="التنظيم_العام_للتكوين" value="جيد جداً">
                    <label for="tanzim4">جيد جداً</label>
                    <input type="radio" id="tanzim5" name="التنظيم_العام_للتكوين" value="ممتاز">
                    <label for="tanzim5">ممتاز</label>
                </div>
            </div>

            <!-- ====== الإيجابيات والسلبيات ====== -->

            <div class="form-group">
                <label for="avantages"><i class="fas fa-thumbs-up"></i> الإيجابيات (les avantages)</label>
                <textarea id="avantages" name="الايجابيات" placeholder="ما هي النقاط الإيجابية في التكوين؟" required></textarea>
            </div>

            <div class="form-group">
                <label for="inconvenients"><i class="fas fa-thumbs-down"></i> السلبيات (salbiyet)</label>
                <textarea id="inconvenients" name="السلبيات" placeholder="ما هي النقاط السلبية أو التي تحتاج تحسين؟" required></textarea>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <i class="fas fa-paper-plane"></i> إرسال التقييم
            </button>

            <div class="note">
                <i class="fas fa-envelope"></i> سيتم إرسال التقييم مباشرة إلى: houssemkessentini77@gmail.com
            </div>
        </form>
    </div>

    <!-- Success Popup -->
    <div class="success-popup" id="successPopup">
        <div class="popup-content">
            <i class="fas fa-check-circle"></i>
            <h2>تم الإرسال بنجاح!</h2>
            <p>شكراً لك، تم إرسال تقييمك إلى البريد الإلكتروني.</p>
            <button onclick="closePopup()">حسناً</button>
        </div>
    </div>

    <script>
        const form = document.getElementById('scoutEvalForm');
        const submitBtn = document.getElementById('submitBtn');
        const popup = document.getElementById('successPopup');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الإرسال...';

            try {
                const formData = new FormData(form);
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: formData,
                    headers: { 'Accept': 'application/json' }
                });

                if (response.ok) {
                    popup.classList.add('show');
                    form.reset();
                } else {
                    alert('حدث خطأ. حاول مرة أخرى.');
                }
            } catch (error) {
                alert('حدث خطأ في الاتصال. تحقق من الإنترنت.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> إرسال التقييم';
            }
        });

        function closePopup() {
            popup.classList.remove('show');
        }
    </script>
</body>
</html>
