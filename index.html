<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقييم التكوين - قادة الكشافة</title>
    <!-- Font Awesome for icons (optional but nice) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #1e3c2c 0%, #2a5a3a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .evaluation-card {
            background-color: #fefefe;
            max-width: 750px;
            width: 100%;
            border-radius: 40px 40px 30px 30px;
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.5), 0 0 0 2px #c9a45c inset;
            padding: 2.5rem 2rem 2rem;
            position: relative;
            border: 1px solid #b58b3e;
            transition: all 0.2s ease;
        }

        /* شعار / زخرفة كشفية */
        .scout-emblem {
            text-align: center;
            font-size: 3rem;
            color: #2a5a3a;
            margin-top: -1.8rem;
            margin-bottom: 0.5rem;
            filter: drop-shadow(0 6px 4px rgba(0,0,0,0.2));
        }

        .scout-emblem i {
            background: #f5e7c8;
            padding: 0.6rem 1.2rem;
            border-radius: 100px;
            box-shadow: 0 4px 0 #8b6b2c;
            border: 1px solid #b58b3e;
        }

        h1 {
            font-size: 2.2rem;
            color: #1e3c2c;
            text-align: center;
            margin-bottom: 0.25rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            text-shadow: 0 1px 2px #e0d6b0;
        }

        .subhead {
            text-align: center;
            color: #5a6b4a;
            font-size: 1.1rem;
            margin-bottom: 2rem;
            border-bottom: 2px dashed #c9a45c;
            padding-bottom: 0.75rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .subhead i {
            color: #b58b3e;
        }

        .form-group {
            margin-bottom: 1.4rem;
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            color: #1e3c2c;
            margin-bottom: 0.5rem;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        label i {
            color: #b58b3e;
            width: 1.4rem;
            text-align: center;
        }

        input, textarea {
            width: 100%;
            padding: 0.9rem 1.2rem;
            border: 2px solid #d4c5a2;
            border-radius: 18px;
            background-color: #fffdf7;
            font-size: 1rem;
            transition: all 0.2s;
            outline: none;
            color: #1e2a1e;
            font-weight: 500;
            resize: vertical;
        }

        input:focus, textarea:focus {
            border-color: #2a5a3a;
            box-shadow: 0 0 0 4px rgba(42, 90, 58, 0.15);
            background-color: #ffffff;
        }

        textarea {
            min-height: 90px;
        }

        /* صف مزدوج للاسم واللقب */
        .row-2 {
            display: flex;
            gap: 1.2rem;
        }

        .row-2 .form-group {
            flex: 1;
        }

        /* زر الإرسال */
        .btn-submit {
            background: #2a5a3a;
            color: #fefefe;
            border: none;
            padding: 1.1rem 2rem;
            font-size: 1.3rem;
            font-weight: 700;
            border-radius: 60px;
            width: 100%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            box-shadow: 0 10px 0 #0d2b1a, 0 8px 18px rgba(0, 0, 0, 0.3);
            transition: all 0.1s ease;
            margin-top: 1rem;
            letter-spacing: 1px;
            border: 2px solid #c9a45c;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .btn-submit:hover {
            background: #1f462b;
            transform: translateY(-2px);
            box-shadow: 0 12px 0 #0d2b1a, 0 12px 22px rgba(0, 0, 0, 0.35);
        }

        .btn-submit:active {
            transform: translateY(4px);
            box-shadow: 0 6px 0 #0d2b1a, 0 8px 18px rgba(0, 0, 0, 0.3);
        }

        .note {
            text-align: center;
            font-size: 0.9rem;
            color: #6b6b5a;
            margin-top: 0.8rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            background: #f0eadb;
            padding: 8px 12px;
            border-radius: 40px;
        }

        .note i {
            color: #b58b3e;
        }

        /* تحسين المظهر على الجوال */
        @media (max-width: 600px) {
            .evaluation-card {
                padding: 2rem 1.2rem 1.5rem;
                border-radius: 30px 30px 20px 20px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .row-2 {
                flex-direction: column;
                gap: 0;
            }

            .btn-submit {
                font-size: 1.1rem;
                padding: 0.9rem 1rem;
            }

            .scout-emblem {
                font-size: 2.5rem;
            }
        }

        /* تأثيرات إضافية للجاذبية */
        .form-group label i.fa-star {
            color: #d4a017;
        }

        /* لون خلفية خاص لحقل الملاحظات */
        #avantages, #inconvenients {
            background-color: #f9f6ed;
        }

        /* رسالة تأكيد الإرسال (تظهر بعد submit) */
        .confirmation-message {
            display: none;
            background: #dff0d8;
            color: #2a5a3a;
            padding: 1rem;
            border-radius: 60px;
            text-align: center;
            font-weight: 600;
            margin-top: 1.2rem;
            border: 2px solid #b1d8a8;
            font-size: 1.1rem;
        }

        .confirmation-message i {
            color: #2e7d32;
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <div class="evaluation-card">
        <!-- رمز الكشافة -->
        <div class="scout-emblem">
            <i class="fas fa-tree"></i>
        </div>

        <h1>تقييم التكوين</h1>
        <div class="subhead">
            <i class="fas fa-flag"></i> قادة الكشافة <i class="fas fa-flag"></i>
        </div>

        <!-- نموذج التقييم باستخدام submitform (action إلى بريد إلكتروني عبر mailto) -->
        <form id="scoutEvalForm" action="mailto:houssemkessentini77@gmail.com" method="post" enctype="text/plain">
            <!-- الصف الأول: الاسم واللقب -->
            <div class="row-2">
                <div class="form-group">
                    <label for="nom"><i class="fas fa-user"></i> الاسم</label>
                    <input type="text" id="nom" name="الاسم" placeholder="مثال: أحمد" required>
                </div>
                <div class="form-group">
                    <label for="prenom"><i class="fas fa-user-tag"></i> اللقب</label>
                    <input type="text" id="prenom" name="اللقب" placeholder="مثال: بن علي" required>
                </div>
            </div>

            <!-- حقل الإيجابيات (les avantage) -->
            <div class="form-group">
                <label for="avantages"><i class="fas fa-thumbs-up"></i> الإيجابيات (les avantages)</label>
                <textarea id="avantages" name="الايجابيات" placeholder="ما هي النقاط الإيجابية في التكوين؟ (مثال: تنظيم جيد، محتوى مفيد، تفاعل القادة...)" required></textarea>
            </div>

            <!-- حقل السلبيات (salbiyet) -->
            <div class="form-group">
                <label for="inconvenients"><i class="fas fa-thumbs-down"></i> السلبيات (salbiyet)</label>
                <textarea id="inconvenients" name="السلبيات" placeholder="ما هي النقاط السلبية أو التي تحتاج تحسين؟ (مثال: ضيق الوقت، نقص الوسائل...)" required></textarea>
            </div>

            <!-- زر الإرسال -->
            <button type="submit" class="btn-submit">
                <i class="fas fa-paper-plane"></i> إرسال التقييم
            </button>

            <!-- ملاحظة توضيحية -->
  

            <!-- رسالة تأكيد (تظهر عند الإرسال) - تُستخدم مع mailto فوراً -->
            <div id="confirmationMsg" class="confirmation-message">
                <i class="fas fa-check-circle"></i> تم فتح بريدك الإلكتروني لإرسال التقييم. شكراً لك!
            </div>
        </form>
    </div>

    <script>
        // تحسين تجربة المستخدم: إظهار رسالة تأكيد عند محاولة الإرسال
        const form = document.getElementById('scoutEvalForm');
        const confirmationMsg = document.getElementById('confirmationMsg');

        form.addEventListener('submit', function(e) {
            // لا نمنع الإرسال (mailto يعمل) لكن نعرض رسالة تأكيد
            // ونعيد تعيين النموذج؟ لا، نترك mailto يعمل.
            // فقط نظهر الرسالة لتشجيع المستخدم.
            confirmationMsg.style.display = 'block';
            
            // إخفاء الرسالة بعد 6 ثواني (اختياري)
            setTimeout(() => {
                confirmationMsg.style.display = 'none';
            }, 6000);

            // ملاحظة: لا نستخدم preventDefault لأن mailto يجب أن يعمل.
            // لكن في بعض المتصفحات قد يظهر تحذير أمني. mailto هو الحل الأمثل بدون سيرفر.
        });

        // تحسين: إذا أراد المستخدم إعادة التعبئة، نخفي الرسالة عند التركيز على أي حقل
        const inputs = form.querySelectorAll('input, textarea');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                confirmationMsg.style.display = 'none';
            });
        });

        // (اختياري) التحقق من صحة البريد الإلكتروني غير مطلوب هنا
    </script>

    <!-- ملاحظة: لقد استخدمنا mailto في action مع method="post" و enctype="text/plain" 
         هذا يسمح بإرسال البيانات إلى البريد الإلكتروني المحدد. 
         سيفتح برنامج البريد الافتراضي لدى المستخدم مع تعبئة الحقول تلقائياً.
         إذا أراد المستخدم الإرسال، يضغط على زر الإرسال في بريده.
         هذا يتوافق مع متطلب "submitform in this email send to this email" -->
</body>
</html>
